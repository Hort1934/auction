<!DOCTYPE html>
<html>
<head>
    <title>Auctions Online - Balance Page</title>
    <style>
        #subbut { 
            margin-top: 20px;
            background: linear-gradient(45deg, #28a745, #20c997) !important;
            border: none !important;
            border-radius: 25px !important;
            padding: 12px 24px !important;
            font-weight: 600 !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3) !important;
        }
        #subbut:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4) !important;
        }
        #upba { 
            margin-top: 70px; 
            padding: 30px;
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
        }
        #topupform {
            margin-bottom: 300px;
            padding: 30px;
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
        }
        .balance-text {
            color: #2c3e50;
            font-weight: 600;
        }
        .form-control {
            border-radius: 15px;
            border: 2px solid #e9ecef;
            padding: 12px 20px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
        }
    </style>
</head>
<body>
{% extends 'index.html' %}
{% block body %}
    <div id="upba" class="balance-text">
        <h2>Update your Balance</h2>
        <hr>
    </div>

    <div class="balance-text">
        <p>Your current balance is: {{ balance }}</p> <!-- Add this line to display the current balance -->
    </div>

    <form id="topupform" method="post" action="/website/balance/topup/">{% csrf_token %}
        <div class="form-group">
            <label for="sel1" class="balance-text">Select an amount to top-up your balance:</label>
            <select class="form-control" id="sel1" name="amount">
                <option value="10.00">10€</option>
                <option value="20.00">20€</option>
                <option value="50.00">50€</option>
            </select>
            <br>
        </div>
        <button id="subbut" type="submit" class="balance-btn btn btn-primary col-sm-12" value="topup">Top Up</button>
    </form>
{% endblock %}
</body>
</html>
